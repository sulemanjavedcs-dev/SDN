name: "Silent ARP"
description: |2
  Handle ARP in the controller without broadcasts.

  Topology:

  +----------+   +----------+    +----------+   +----------+
  |    H1    |   |    H2    |    |    H5    |   |    H6    |
  +----------+   +----------+    +----------+   +----------+
           |       |                      |       |
           | 1     | 2                    | 2     | 3
           |       |                      |       |
         +-----------+  5            1  +-----------+
         | Switch s1 | ---------------- | Switch s2 |
         +-----------+                  +-----------+
           |       |                      |       |
           | 3     | 4                    | 4     | 5
           |       |                      |       |
  +----------+   +----------+    +----------+   +----------+
  |    H3    |   |    H4    |    |    H7    |   |    H8    |
  +----------+   +----------+    +----------+   +----------+

topology:
  hosts:
    - name: H1
      ip: "10.0.0.1"
    - name: H2
      ip: "10.0.0.2"
    - name: H3
      ip: "10.0.0.3"
    - name: H4
      ip: "10.0.0.4"
    - name: H5
      ip: "10.0.1.1"
    - name: H6
      ip: "10.0.1.2"
    - name: H7
      ip: "10.0.1.3"
    - name: H8
      ip: "10.0.1.4"

  switches:
    - name: S1
      dpid: 1
    - name: S2
      dpid: 2

  links:
    - [H1, S1]
    - [H2, S1]
    - [H3, S1]
    - [H4, S1]
    - [S1, S2]
    - [H5, S2]
    - [H6, S2]
    - [H7, S2]
    - [H8, S2]
